name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate migrations
        run: node scripts/validate-migrations.mjs
      - name: Tenant isolation regression checks
        run: node scripts/security-regression.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Reject trusted identity headers in API routes
        shell: bash
        run: |
          if grep -R -n -E 'x-actor-id|x-organization-id' src/app/api; then
            echo 'Legacy trusted identity headers found in API routes.'
            exit 1
          fi
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -n -E '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- ':!package-lock.json'; then
            echo 'Potential committed secret detected.'
            exit 1
          fi
