name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate migrations
        run: node scripts/validate-migrations.mjs
      - name: Migration validation regression checks
        run: node scripts/migration-validation-regression.mjs
      - name: Validate Prometheus alert rules
        run: node scripts/validate-prometheus-alerts.mjs
      - name: Apply migrations to PostgreSQL
        run: npm run migrate
      - name: Migration advisory lock regression checks
        run: node scripts/migration-lock-regression.mjs
      - name: Database concurrency regression checks
        run: node scripts/database-concurrency-regression.mjs
      - name: PostgreSQL timeout and recovery regression checks
        run: node scripts/postgres-timeout-regression.mjs
      - name: PostgreSQL pool saturation regression checks
        run: node scripts/postgres-pool-saturation-regression.mjs
      - name: Transactional outbox concurrency regression checks
        run: node scripts/outbox-concurrency-regression.mjs
      - name: Stripe event idempotency regression checks
        run: node scripts/stripe-event-idempotency-regression.mjs
      - name: Stripe customer tenant-binding regression checks
        run: node scripts/stripe-customer-binding-regression.mjs
      - name: Stripe signature rotation regression checks
        run: node scripts/stripe-signature-regression.mjs
      - name: Tenant isolation regression checks
        run: node scripts/security-regression.mjs
      - name: Access context configuration regression checks
        run: node scripts/access-context-regression.mjs
      - name: Execution reliability regression checks
        run: node scripts/execution-reliability-regression.mjs
      - name: Shutdown drain/readiness regression checks
        run: node scripts/shutdown-drain-regression.mjs
      - name: Orchestration load-shedding regression checks
        run: node scripts/orchestrate-load-shedding-regression.mjs
      - name: Tenant concurrency regression checks
        run: node scripts/tenant-concurrency-regression.mjs
      - name: Distributed tenant concurrency regression checks
        run: node scripts/distributed-tenant-concurrency-regression.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Stripe webhook payload bound regression checks
        run: node scripts/stripe-webhook-payload-regression.mjs
      - name: Metrics endpoint production regression checks
        run: node scripts/metrics-route-regression.mjs
      - name: Health and readiness production regression checks
        run: node scripts/health-readiness-route-regression.mjs
      - name: Reject trusted identity headers in API routes
        shell: bash
        run: |
          if grep -R -n -E 'x-actor-id|x-organization-id' src/app/api; then
            echo 'Legacy trusted identity headers found in API routes.'
            exit 1
          fi
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -n -E '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- ':!package-lock.json'; then
            echo 'Potential committed secret detected.'
            exit 1
          fi
